name: Convert Markdown to Markmap HTML

on:
  push:
    branches:
      - "**"

jobs:
  markmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: get date time
        id: date
        run: echo "date_time=$(date +'%Y-%m-%dT%H:%M:%S%z')" >> $GITHUB_ENV

      - name: get git diff
        id: git_diff
        run: |
          # 获取上一次提交的 SHA
          PREVIOUS_COMMIT=$(git rev-parse HEAD^)
          # 获取当前提交的 SHA
          CURRENT_COMMIT=$(git rev-parse HEAD)
          # 生成两次提交之间的差异
          DIFF=$(git diff $PREVIOUS_COMMIT $CURRENT_COMMIT || true)
          # 转义特殊字符，避免破坏环境文件格式
          # 使用 GitHub 环境文件语法设置多行环境变量
          echo "diff<<EOF" > 0
          echo "$DIFF" >> 0 
          echo "EOF" >> 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CN fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install npm packages
        run: |
          npm install -g markmap-cli
          npm install puppeteer

      - name: clean up
        run: |
          rm -rf public
          mkdir -p public/html
          mkdir -p public/pdf

      - name: Find and convert all .md files to HTML in /public, preserving structure
        run: bash .tools/md2html.sh

      - name: Convert all HTML in public/html to PDF in public/pdf (preserve structure)
        run: node .tools/html2pdf.js

      - name: pack PDF files
        run: |
          echo $(pwd)
          echo $(ls)
          echo $(ls ..)
          cd public/pdf
          zip -r public/思维导图.zip .
          cd ../../

      - name: create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ env.date_time }}
          release_name: Release ${{ env.date_time }}
          body: |
            发布时间: ${{ env.date_time }}

            ### 代码变更
            ```diff
            ${{ env.diff }}
            ```
          draft: false
          prerelease: false

      - name: upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./public/思维导图.zip
          asset_name: 思维导图.zip
          asset_content_type: application/zip

