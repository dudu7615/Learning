name: Convert Markdown to Markmap HTML

on:
  push:
    branches:
      - '**'

jobs:
  markmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markmap-cli
        run: npm install -g markmap-cli

      - name: Find and convert all .md files to HTML in /public, preserving structure
        run: |
          rm -rf public/html
          mkdir -p public/html
          find . -type f -name '*.md' | while read mdfile; do
            htmlfile="public/html/${mdfile#./}"
            htmlfile="${htmlfile%.md}.html"
            mkdir -p "$(dirname "$htmlfile")"
            markmap "$mdfile" -o "$htmlfile"
          done

      - name: Upload /public as artifact (可选)
        uses: actions/upload-artifact@v4
        with:
          name: markmap-html
          path: public/html

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push /public directory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin ${{ github.ref }}
          git checkout ${{ github.ref }}
          git add public/html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update markmap htmls [skip ci]"
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
            git push origin HEAD:${{ github.ref }}
          fi

